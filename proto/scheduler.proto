syntax = "proto3";

package scheduler;

option go_package = "banqi/server/pb";

// worker 拉取任务请求（含机器规格，服务端按规格匹配任务量）
message TaskRequest {
  string worker_id = 1;
  string client_version = 2;
  int32 threads = 3;          // 可用线程数
  int64 memory_mb = 4;        // 可用内存
  string current_network = 5; // 本地已有网络 sha（空表示需要下载）
}

// 任务响应
message TaskResponse {
  string task_id = 1;
  TaskKind kind = 2;
  string network_sha = 3;       // 主网络（训练网络）
  string opponent_sha = 4;      // rating 对打时的对手网络；selfplay 为空
  string network_url = 5;       // R2 预签名下载 URL（主网络）；空 = 本地已有缓存
  string opponent_url = 6;      // 对手网络下载 URL
  string network_sha_remote = 7;  // 服务端当前 best sha（用于本地缓存比对）
  int32 games = 8;              // 本批对局数
  SelfPlayParams params = 9;
  string message = 10;          // 无任务时的说明（task_waiting 等）
  // 网络对象键（networks/<sha>.<ext>）：恒下发，worker 的本地缓存路径即
  // cache_dir/<network_key>，扩展名即权重格式（onnx / pt / nnue）。
  string network_key = 11;
  string opponent_key = 12;     // rating 任务的对手网络对象键
  // 重搜任务（TASK_REANALYSIS）携带的历史局面载荷（版本化紧凑编码，格式见
  // banqi-collector/src/pipeline/self_play/reanalysis.rs 的 encode_payload）。
  // 其余任务为空。games 字段对重搜任务表示「位置条数」。
  bytes reanalysis_payload = 13;
  // 绝对强度评估（TASK_EVAL）的对手标识；空 = 用 opponent_sha / opponent_url 指定的网络。
  // 取值形如 "rule:capture_first" / "rule:reveal_first" / "random"。
  // 评估模式（纯策略 / 带搜索）由 params.mcts_sims 决定：0 = 纯策略 argmax，>0 = MCTS 模拟数。
  string opponent_spec = 14;
}

enum TaskKind {
  TASK_NONE = 0;      // 无任务，按 message 退避轮询
  TASK_SELFPLAY = 1;
  TASK_RATING = 2;    // gatekeeper / rating 对打
  // 局面重搜（reanalysis）：用当前 best 网络对下发的历史局面重跑 MCTS，
  // 产出新的策略/价值目标（一局面一条 1 样本 episode），走 ReportEpisode 常规通道上报。
  TASK_REANALYSIS = 3;
  // 绝对强度评估（eval）：指定网络 vs 规则/内建对手，只统计胜负、不产 episode、
  // 不参与 gatekeeper 晋级（结果落 eval_results，仅用于趋势观测与停机判据）。
  // 对手由 TaskResponse.opponent_spec 指定；评估模式由 SelfPlayParams.mcts_sims 决定。
  TASK_EVAL = 4;
}

// 训练数据类别：决定 worker 产哪类记录、trainer 消费哪类对象。
// 两类互斥（同一批对象只含一种），由服务端下发（SCHEDULER_DATA_KIND / WebUI 在线切换）。
enum DataKind {
  DATA_RESNET = 0;    // Gumbel MCTS 自对弈 → EpisodeRecord（ResNet 稠密特征，配 .onnx 权重）
  DATA_NNUE = 1;      // Expectimax 强自对弈 → NnueEpisodeRecord（NNUE 稀疏特征，配 .nnue 权重）
}

message SelfPlayParams {
  int32 mcts_sims = 1;
  float temperature = 2;
  bool playout_cap_random = 3;
  string variant = 4;           // 4x8 / 4x4 / 4x2
  string extra_config = 5;      // JSON 透传
  DataKind data_kind = 6;       // 本任务要产的数据类别（rating 任务不产数据，该字段无意义）
}

// episode 元数据上报：服务端只收元数据 + 签发 R2 预签名 PUT，数据直传 R2
message EpisodeMeta {
  string worker_id = 1;
  string task_id = 2;
  int32 game_count = 3;
  int32 total_steps = 4;
  int32 winner = 5;             // 1 红 / -1 黑 / 0 平；rating 任务另有字段
  string network_sha = 6;
  int64 timestamp = 7;
  int64 content_length = 8;     // 待上传对象大小
  string content_sha256 = 9;    // 对象 sha256（R2 强校验）
  DataKind kind = 10;           // 本批对象的数据类别（落库，供 ListEpisodes 按类别过滤）
}

message EpisodeAck {
  bool accepted = 1;
  string message = 2;
  string upload_url = 3;        // 预签名 PUT URL；accepted=false 时为空
  string object_key = 4;        // R2 对象键 episodes/<sha>/<uuid>.epb.gz
}

// 网络请求：sha 为空 = 拉取当前 best
message NetworkRequest {
  string sha = 1;
}

message NetworkInfo {
  string sha = 1;
  string download_url = 2;      // 预签名 GET URL
  int64 created_at = 3;
  bool is_best = 4;
  string game_data = 5;         // 训练侧附加信息（parent sha 等），JSON
  string key = 6;               // 对象键 networks/<sha>.<ext>（供 worker 预取缓存命名）
}

// trainer（GPU 机）注册新网络 → 触发 gatekeeper 对打
message RegisterNetworkRequest {
  string sha = 1;
  string parent_sha = 2;
  string upload_url = 3;        // trainer 已直传 R2，这里登记元数据
  string notes = 4;
  // 权重格式（onnx / pt / nnue）：与 SignNetworkUploadRequest.format 一致，
  // 决定对象键扩展名；两处必须由 upload 方用同一来源填写。
  string format = 5;
}

message RegisterNetworkAck {
  bool accepted = 1;
  string message = 2;
  string match_task_hint = 3;   // 若已生成 gatekeeper 任务，附说明
}

// 对局结果上报（selfplay 汇总 / rating 单局）
message MatchResult {
  string worker_id = 1;
  string task_id = 2;
  TaskKind kind = 3;
  string network_sha = 4;
  string opponent_sha = 5;
  int32 games = 6;              // 本批局数
  int32 wins = 7;               // 主网络视角（统计用）
  int32 losses = 8;
  int32 draws = 9;
  // 成对五项计数（换色配对两局一组）：rating 任务必填，selfplay 为 0
  int32 pair_ll = 10;
  int32 pair_ld = 11;
  int32 pair_dd = 12;
  int32 pair_dw = 13;
  int32 pair_ww = 14;
  // 绝对强度评估（TASK_EVAL）：对手标识（与 TaskResponse.opponent_spec 同源，回显便于对账）。
  // 其余任务为空。
  string opponent_spec = 15;
  // 平均对局步数（TASK_EVAL 统计用；rating / selfplay 未填时为 0）。
  float avg_moves = 16;
}

message MatchResultAck {
  bool accepted = 1;
  string message = 2;
  bool match_concluded = 3;     // 该 gatekeeper 对打已出结论
  bool promoted = 4;            // 新网络晋级 best
  string best_sha = 5;          // 晋级后的 best（未变则当前 best）
}

// 心跳 + 控制参数（worker 周期上报资源与版本声明）
message HeartbeatRequest {
  string worker_id = 1;
  int32 current_threads = 2;
  int32 completed_games = 3;
  string running_task_id = 4;
  string client_version = 5;    // collector 版本声明（仅记录/展示，不做强校验）
  int64 memory_mb = 6;          // 可用内存
}

message HeartbeatReply {
  bool pause_self_play = 1;
  int32 mcts_sims = 2;          // 覆盖值，0 表示不覆盖
  float temperature = 3;
  bool playout_cap_random = 4;
  string best_network = 5;      // 当前 best sha（供 worker 判断是否换网）
}

// trainer 请求签发网络上传预签名 PUT（R2 凭据只在调度器持有，trainer 零配置）
message SignNetworkUploadRequest {
  string trainer_id = 1;
  string sha = 2;               // 网络内容 sha256（决定对象键与去重）
  int64 content_length = 3;
  string content_sha256 = 4;
  // 权重格式（onnx / pt / nnue）：决定对象键扩展名，供 worker 按格式分派加载器。
  string format = 5;
}

message SignNetworkUploadAck {
  bool accepted = 1;
  string message = 2;
  string upload_url = 3;        // 预签名 PUT；accepted=false 时为空
  string object_key = 4;        // networks/<sha>.<format>
}

// trainer 拉取已登记 episode 的预签名 GET 列表（游标分页）
message ListEpisodesRequest {
  int32 limit = 1;              // 单次最多返回条数（0 = 服务端默认）
  string after_key = 2;         // 游标：上次返回的最后一个对象键（服务端按登记顺序推进）
  // 数据类别过滤：缺省 = 不过滤。consumer 应显式指定自己消费的类别，
  // 避免下载并解析无法消费的对象。
  optional DataKind kind = 3;
}

message EpisodeObject {
  string object_key = 1;
  string download_url = 2;
  int64 size = 3;
}

message ListEpisodesReply {
  repeated EpisodeObject objects = 1;
  bool has_more = 2;
}

// trainer 提交「局面重搜」任务：把从历史 episode 里攒下的局面快照交给调度器，
// 由任意 worker 用当前 best 网络重跑 MCTS 刷新训练目标（跨进程 reanalysis）。
message SubmitReanalysisRequest {
  string requester = 1;   // 提交方标识（日志用）
  string variant = 2;     // 必须与服务端 VARIANT 一致，否则拒绝（防串变体）
  int32 mcts_sims = 3;    // 重搜模拟次数；0 = 用 worker 自对弈配置的默认值
  uint32 positions = 4;   // 位置条数（仅统计/展示；权威值在 payload 内）
  bytes payload = 5;      // 位置载荷（见 reanalysis.rs 的 encode_payload）
}

message SubmitReanalysisReply {
  bool accepted = 1;
  string message = 2;
  uint64 queued_positions = 3;   // 入队后待重搜的位置总数（含本次）
}

// 调度器全局信息（trainer 启动时获取变体，无需命令行传入）
message GetInfoRequest {}

message GetInfoReply {
  string variant = 1;
  // trainer 轮询：true 时按既有优雅停止路径收尾（先让 worker 完成当前轮并落
  // checkpoint，再退出）。由调度器按绝对强度判据置位（如「连续 N 次评测无提升」），
  // 见 banqi-scheduler/internal/scheduler/eval.go。
  bool should_stop = 2;
  string stop_reason = 3;
}

// ============================================================================
// 训练数据记录（episode 对象载荷）
//
// worker 把一批 episode 编码为 EpisodeBatch → gzip → 直传 R2，对象键
// `episodes/<network_sha>/<data_id>.epb.gz`。本组消息是训练数据的唯一字段
// 契约；调度器只登记元数据、不解析对象内容。
//
// 约定：
// - 字段号只增不改；任何破坏性变更必须提升 schema_version，训练端遇到不认识
//   的版本直接拒绝（不静默降级）。
// - 所有 bytes 字段是「稠密小端缓冲区」，训练端用 np.frombuffer 零拷贝还原，
//   不做逐元素文本解析。
// - 位打包（boards_bits / action_masks_bits）：字节内高位对应较小下标
//   （与 numpy.unpackbits(bitorder='big') 一致），尾部补 0；棋盘布局为
//   [步][通道][位置字节]（每通道独立字节对齐），掩码布局为 [步][动作字节]。
// - 数据类别（kind）互斥：一批对象只承载一种记录，产出方只上报实际产出的那一类。
// ============================================================================

message EpisodeBatch {
  uint32 schema_version = 1;
  string variant = 2;                    // 4x8 / 4x4 / 4x2（训练端据此校验变体一致）
  DataKind kind = 5;                     // 本批数据类别：与下述两个 repeated 唯一非空项一致
  // 两类记录互斥：kind=DATA_RESNET 时只有 episodes，kind=DATA_NNUE 时只有 nnue_episodes。
  // 空 repeated 在 proto3 不占字节，worker 只上报实际产出的那一类（按需）。
  repeated EpisodeRecord episodes = 3;   // Gumbel MCTS 自对弈记录
  repeated NnueEpisodeRecord nnue_episodes = 4;  // Expectimax 强自对弈记录
}

// ResNet 网络（Gumbel MCTS）自对弈的完整记录，字段与训练样本一一对应。
message EpisodeRecord {
  uint32 steps = 1;            // 有效训练样本数（下述各张量的第 0 维）
  uint32 board_channels = 2;   // 棋盘特征通道数（= 变体 board_channels）
  uint32 board_rows = 3;
  uint32 board_cols = 4;
  uint32 scalar_count = 5;
  uint32 action_space = 6;
  // steps × board_channels × ceil(rows*cols/8) 的 0/1 位平面。
  bytes boards_bits = 7;
  // steps × scalar_count 的 f32（标量特征，稠密）。
  bytes scalars = 8;
  // steps × action_space 的 f32（改进策略概率 pi_target，稠密；无法稀疏化）。
  bytes policies = 9;
  // steps × ceil(action_space/8) 的 0/1 位图（合法动作掩码）。
  bytes action_masks_bits = 10;
  bytes mcts_values = 11;      // steps × f32（根节点价值，行棋方视角）
  bytes completed_qs = 12;     // steps × f32（所选动作的 Q）
  bytes game_results = 13;     // steps × f32（终局回报，行棋方视角）
  bytes health_diffs = 14;     // steps × f32（终局归一化血量差，行棋方视角）
  bytes root_visits = 15;      // steps × u32（根节点访问次数）
  bytes actions = 16;          // steps × u32（实际落子动作索引）
  bytes is_full_search = 17;   // steps × u8（0/1：算力随机化的 Full Search 标记）
  uint32 game_length = 18;     // 实际对局步数（出错路径下 samples 为空，可能 > steps）
  optional int32 winner = 19;  // 1 红 / -1 黑 / 0 平；缺省 = 本局作废
  optional float health_diff_red = 20;  // 红方视角的终局血量差
  reserved 21;                 // 曾用于「MCTS 记录内嵌 NNUE 稀疏特征」，已废弃：
                               // NNUE 特征只由 NnueEpisodeRecord 承载，两类数据彻底分家
  // steps 个局面快照（每个 = banqi_core::core::env::PositionSnapshot::encode 的字节串，
  // 约 135 字节/步）。空 = 本批未收集（collect_positions=false）。用途：训练侧保留历史
  // 局面，稍后用更强的网络重跑 MCTS 刷新策略/价值目标（跨进程 reanalysis）。
  repeated bytes positions = 22;
}

// NNUE 特征布局元信息（由 env.config 推导，训练端免硬编码还原维度）。
message NnueMeta {
  uint32 feature_dim = 1;
  uint32 states_per_square = 2;
  uint32 bag_stride = 3;
  uint32 num_active = 4;
  uint32 total_positions = 5;
}

// 每步双视角稀疏特征索引：按步顺序把 mover 段与 opponent 段拼进 indices，
// offsets 为前缀和（长度 2*steps+1），第 i 步：
//   mover    = indices[offsets[2i]   : offsets[2i+1]]
//   opponent = indices[offsets[2i+1] : offsets[2i+2]]
message NnueFeatures {
  NnueMeta meta = 1;
  bytes indices = 2;   // 全部索引（u32）顺序拼接
  bytes offsets = 3;   // (2*steps+1) × u32 前缀和
}

// Expectimax 强自对弈的 NNUE 专属记录（无 ResNet 大张量）。
message NnueEpisodeRecord {
  uint32 steps = 1;
  NnueFeatures features = 2;   // 双视角稀疏特征（布局元信息 + 索引 + 前缀和偏移）
  bytes search_values = 3;     // steps × f32（搜索根值，行棋方视角）
  bytes players = 4;           // steps × i32（1 红 / -1 黑）
  bytes actions = 5;           // steps × u32
  uint32 game_length = 6;
  optional int32 winner = 7;
}

service SchedulerService {
  rpc GetInfo (GetInfoRequest) returns (GetInfoReply);
  rpc GetTask (TaskRequest) returns (TaskResponse);
  rpc ReportEpisode (EpisodeMeta) returns (EpisodeAck);
  rpc GetNetwork (NetworkRequest) returns (NetworkInfo);
  rpc RegisterNetwork (RegisterNetworkRequest) returns (RegisterNetworkAck);
  rpc ReportMatchResult (MatchResult) returns (MatchResultAck);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);
  rpc SignNetworkUpload (SignNetworkUploadRequest) returns (SignNetworkUploadAck);
  rpc ListEpisodes (ListEpisodesRequest) returns (ListEpisodesReply);
  // trainer 提交局面重搜任务（异步：入队后由 GetTask 分发给任意 worker）
  rpc SubmitReanalysis (SubmitReanalysisRequest) returns (SubmitReanalysisReply);
}
