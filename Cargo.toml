[package]
name = "banqi-collector"
version = "0.1.0"
edition = "2024"
description = "Banqi 分布式训练数据采集 crate：SchedulerRegistry（gRPC + R2 直传）与自对弈主干，供 banqi-scheduler 体系使用"

[dependencies]
banqi-core = { path = "../banqi-core" }
# 策略与推理引擎层：ONNX 推理后端（OnnxModel / OnnxEvaluator）
banqi-engine = { path = "../banqi-engine", optional = true }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
flate2 = "1"
num_cpus = "1.17"
rand = "0.8"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
tonic = "0.12"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[features]
default = []
onnx = ["dep:banqi-engine", "banqi-engine/onnx"]
onnx-cuda = ["onnx", "banqi-engine/onnx-cuda"]

[[bin]]
name = "banqi-collector"
path = "src/bin/collector.rs"
required-features = ["onnx"]

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
